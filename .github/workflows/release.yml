name: Build & release desktop apps

# Triggered manually from the Actions tab, or automatically when a tag
# matching v* is pushed. On a tag the different installer are attached to the GitHub
# Release; on a manual run it is uploaded as a workflow artifact.
#
# This builds an installer for Windows x64, a portable Windows x64 version, a Linux x64 version, and a macOS arm64 version.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # si macOS échoue, Linux/Windows continuent quand même
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact_glob: |
              dist/CryptTraject-Setup-x64.exe
              dist/CryptTraject-Windows-x64-portable.zip
          - os: ubuntu-latest
            label: linux-x64
            artifact_glob: dist/CryptTraject-Linux-x86_64.zip
          - os: macos-latest
            label: macos-arm64
            artifact_glob: dist/CryptTraject-macOS-arm64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Linux : Pyfhel a besoin de g++ pour compiler / lier SEAL
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev
      - name: Install macOS build deps (Pyfhel needs GCC + OpenMP)
        if: runner.os == 'macOS'
        run: |
          brew install gcc libomp cmake
          if [[ $(uname -m) = "arm64" ]]; then
            BREW_GCC_PATH="/opt/homebrew/bin"
          else
            BREW_GCC_PATH="/usr/local/bin"
          fi
          echo "CC=$BREW_GCC_PATH/$(ls $BREW_GCC_PATH | grep ^gcc-[0-9] | sort -V -r | head -n 1)" >> $GITHUB_ENV
          echo "CXX=$BREW_GCC_PATH/$(ls $BREW_GCC_PATH | grep ^g++-[0-9] | sort -V -r | head -n 1)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion)" >> $GITHUB_ENV
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller>=6.3
      - name: Install Inno Setup (Windows only)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build
        run: python packaging/build_binaries.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crypttraject-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # release seulement sur un tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true